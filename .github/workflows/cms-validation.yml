name: CMS Validation

on:
  push:
    branches:
      - 'agent/cms-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cms-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, libxml, sqlite3
          coverage: none
          tools: composer:v2
      - name: Validate and test backend
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force
          vendor/bin/pint --test
          php artisan test
          php artisan route:list --path=api/v1

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Guard protected reference masters
        working-directory: mobile
        shell: bash
        run: bash tool/guard_protected_reference_masters.sh "$(git merge-base origin/main HEAD)"
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: mobile
        shell: bash
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        id: flutter_analyze
        continue-on-error: true
        working-directory: mobile
        shell: bash
        run: |
          mkdir -p ../cms-ci
          set +e
          flutter analyze 2>&1 | tee ../cms-ci/flutter-analyze.log
          status=${PIPESTATUS[0]}
          echo "$status" > ../cms-ci/flutter-analyze.status
          exit "$status"
      - name: Test
        id: flutter_test
        if: always()
        continue-on-error: true
        working-directory: mobile
        shell: bash
        run: |
          mkdir -p ../cms-ci
          set +e
          timeout --signal=TERM 180s flutter test --reporter expanded 2>&1 | tee ../cms-ci/flutter-test.log
          status=${PIPESTATUS[0]}
          echo "$status" > ../cms-ci/flutter-test.status
          exit "$status"
      - name: Upload Flutter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walka-cms-flutter-diagnostics-${{ github.sha }}
          path: cms-ci/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce Flutter quality gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          analyze_status="$(cat cms-ci/flutter-analyze.status 2>/dev/null || echo 99)"
          test_status="$(cat cms-ci/flutter-test.status 2>/dev/null || echo 99)"
          echo "flutter analyze status: $analyze_status"
          echo "flutter test status: $test_status"
          test "$analyze_status" = "0"
          test "$test_status" = "0"
      - name: Generate Android runner
        working-directory: mobile
        run: flutter create --platforms=android --project-name walka .
      - name: Reconcile dependencies
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          flutter pub get --enforce-lockfile
      - name: Apply Android branding
        working-directory: mobile
        run: bash tool/apply_android_branding.sh
      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release
      - name: Build release AAB
        working-directory: mobile
        run: flutter build appbundle --release
      - name: Verify release artifacts contain no bundled product media
        shell: bash
        run: |
          set -euo pipefail
          apk='mobile/build/app/outputs/flutter-apk/app-release.apk'
          aab='mobile/build/app/outputs/bundle/release/app-release.aab'
          for artifact in "$apk" "$aab"; do
            if unzip -Z1 "$artifact" | grep -E 'flutter_assets/assets/products/(drawer|lunch)/.*\.(png|jpe?g|webp)$'; then
              echo "Bundled product media found in $artifact." >&2
              exit 1
            fi
          done
          mkdir -p cms-release
          cp "$apk" cms-release/WALKA-latest.apk
          cp "$aab" cms-release/WALKA-latest.aab
          sha256sum cms-release/WALKA-latest.apk > cms-release/WALKA-latest.apk.sha256
          sha256sum cms-release/WALKA-latest.aab > cms-release/WALKA-latest.aab.sha256
          printf 'version=%s\nsource=%s\n' "$(awk '/^version:/ {print $2; exit}' mobile/pubspec.yaml)" "$GITHUB_SHA" > cms-release/BUILD.txt
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: walka-cms-release-${{ github.sha }}
          path: cms-release/
          if-no-files-found: error
          retention-days: 14
