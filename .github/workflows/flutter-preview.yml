name: Flutter Preview

on:
  push:
    branches:
      - main
      - 'agent/ui-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Generate Android runner
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.walka --project-name walka --no-pub .
          fi

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: walka-ui-preview-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
