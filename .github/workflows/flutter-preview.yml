name: Flutter Preview

on:
  push:
    branches:
      - main
      - 'agent/ui-*'
      - 'agent/api-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee flutter-analyze.log

      - name: Test
        working-directory: mobile
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee flutter-test.log

      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-validation-diagnostics-${{ github.sha }}
          path: |
            mobile/flutter-analyze.log
            mobile/flutter-test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Generate Android runner
        working-directory: mobile
        run: flutter create --platforms=android --project-name walka .

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: walka-ui-preview-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
