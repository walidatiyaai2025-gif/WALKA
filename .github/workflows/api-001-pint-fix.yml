name: API-001 Pint Fix

on:
  push:
    branches:
      - agent/api-001-laravel-foundation
    paths:
      - '.github/workflows/api-001-pint-fix.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/api-001-laravel-foundation

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, libxml, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Format ProductData
        working-directory: backend
        run: vendor/bin/pint app/Data/ProductData.php

      - name: Commit formatting
        run: |
          git config user.name "WALKA Team Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/Data/ProductData.php
          git commit -m "API-001: apply Laravel Pint formatting"
          git push origin HEAD:agent/api-001-laravel-foundation
