name: PIMG White Frame Once

on:
  push:
    branches:
      - agent/pimg-031-070-white-canonical
    paths:
      - .github/workflows/pimg-white-frame-once.yml

permissions:
  contents: write

jobs:
  frame-white:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/pimg-031-070-white-canonical
          fetch-depth: 0
      - name: Ensure ImageMagick
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y imagemagick; fi
      - name: Normalize product-only framing
        shell: bash
        run: |
          set -euo pipefail
          src='mobile/assets/products/drawer/white.png'
          convert "$src" -trim +repage -resize '922x922' -background none -gravity center -extent 1024x1024 -channel RGBA -depth 8 -strip -colorspace sRGB -set colorspace sRGB -define png:color-type=6 PNG32:"$src"
          python3 - <<'PY'
          import pathlib,struct,zlib
          p=pathlib.Path('mobile/assets/products/drawer/white.png'); d=p.read_bytes(); off=8; chunks=[]
          while off<len(d):
            n=struct.unpack('>I',d[off:off+4])[0]; k=d[off+4:off+8]; q=d[off+8:off+8+n]; chunks.append((k,q)); off+=12+n
          def c(k,q): return struct.pack('>I',len(q))+k+q+struct.pack('>I',zlib.crc32(k+q)&0xffffffff)
          out=bytearray(d[:8])
          for k,q in chunks:
            if k in {b'tEXt',b'zTXt',b'iTXt',b'tIME',b'bKGD',b'sRGB',b'iCCP'}: continue
            out.extend(c(k,q))
            if k==b'IHDR': out.extend(c(b'sRGB',b'\x00'))
          p.write_bytes(bytes(out))
          PY
      - name: Validate and stage QA artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/review
          cp mobile/assets/products/drawer/white.png /tmp/review/white.png
          python3 - <<'PY'
          import hashlib, pathlib, struct, zlib
          p = pathlib.Path('mobile/assets/products/drawer/white.png')
          data = p.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert len(data) <= 1200 * 1024, len(data)
          off = 8
          chunks = []
          idat = bytearray()
          while off < len(data):
              n = struct.unpack('>I', data[off:off+4])[0]
              kind = data[off+4:off+8]
              payload = data[off+8:off+8+n]
              stored = struct.unpack('>I', data[off+8+n:off+12+n])[0]
              assert stored == (zlib.crc32(kind + payload) & 0xffffffff)
              chunks.append(kind)
              if kind == b'IHDR':
                  width, height, bit_depth, color_type, compression, filtering, interlace = struct.unpack('>IIBBBBB', payload)
              elif kind == b'IDAT':
                  idat.extend(payload)
              off += 12 + n
          assert (width, height, bit_depth, color_type) == (1024, 1024, 8, 6)
          assert b'sRGB' in chunks
          raw = zlib.decompress(bytes(idat))
          stride = width * 4
          previous = bytearray(stride)
          cursor = 0
          visible = []
          partial = 0
          for y in range(height):
              ft = raw[cursor]; cursor += 1
              scan = bytearray(raw[cursor:cursor+stride]); cursor += stride
              recon = bytearray(stride)
              for x in range(stride):
                  left = recon[x-4] if x >= 4 else 0
                  up = previous[x]
                  ul = previous[x-4] if x >= 4 else 0
                  value = scan[x]
                  if ft == 0: pred = 0
                  elif ft == 1: pred = left
                  elif ft == 2: pred = up
                  elif ft == 3: pred = (left + up) // 2
                  elif ft == 4:
                      q = left + up - ul
                      pa, pb, pc = abs(q-left), abs(q-up), abs(q-ul)
                      pred = left if pa <= pb and pa <= pc else (up if pb <= pc else ul)
                  else: raise AssertionError(ft)
                  recon[x] = (value + pred) & 255
              for x in range(width):
                  a = recon[x*4+3]
                  if a: visible.append((x,y))
                  if 0 < a < 255: partial += 1
              previous = recon
          assert visible
          xs=[x for x,_ in visible]; ys=[y for _,y in visible]
          bbox=[min(xs),min(ys),max(xs),max(ys)]
          margins=[bbox[0],width-1-bbox[2],bbox[1],height-1-bbox[3]]
          assert min(margins) >= 51, margins
          assert abs(margins[0]-margins[1]) <= 1, margins
          sha=hashlib.sha256(data).hexdigest()
          text=(f'bytes={len(data)}\nsha256={sha}\nwidth={width}\nheight={height}\n'
                f'alpha_bbox={bbox}\nsafe_margins={margins}\nnearest_safe_margin={min(margins)}\n'
                f'partial_alpha_pixels={partial}\nprofile=sRGB\n')
          print(text)
          pathlib.Path('/tmp/review/metadata.txt').write_text(text)
          PY
          convert -size 1024x1024 xc:white mobile/assets/products/drawer/white.png -gravity center -compose over -composite /tmp/review/white-on-white.jpg
          convert -size 1024x1024 xc:'#F8F6F1' mobile/assets/products/drawer/white.png -gravity center -compose over -composite /tmp/review/white-on-ivory.jpg
          convert -size 1024x1024 xc:'#003366' mobile/assets/products/drawer/white.png -gravity center -compose over -composite /tmp/review/white-on-navy.jpg
          for s in 96 160 240 384; do convert mobile/assets/products/drawer/white.png -resize "${s}x${s}" "/tmp/review/white-${s}.png"; done
      - uses: actions/upload-artifact@v4
        with:
          name: pimg-white-framed-review-${{ github.sha }}
          path: /tmp/review/
          retention-days: 14
      - name: Commit framed White and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pimg-white-frame-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/assets/products/drawer/white.png .github/workflows/pimg-white-frame-once.yml
          git commit -m 'PIMG-036..040: finalize Drawer White canonical framing'
          git push origin HEAD:agent/pimg-031-070-white-canonical
