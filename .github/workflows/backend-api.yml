name: Backend API

on:
  push:
    branches:
      - main
      - 'agent/api-*'
    paths:
      - 'backend/**'
      - 'docs/PRODUCT_MASTER.md'
      - '.github/workflows/backend-api.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docs/PRODUCT_MASTER.md'
      - '.github/workflows/backend-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, libxml, sqlite3
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest
        working-directory: backend
        run: composer validate --strict

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite

      - name: Verify migrations and production seed
        working-directory: backend
        run: |
          php artisan migrate:fresh --seed --force
          php artisan tinker --execute="throw_unless(\\App\\Models\\Product::count() === 2); throw_unless(\\App\\Models\\ProductVariant::count() === 5);"

      - name: Check PHP formatting
        working-directory: backend
        run: vendor/bin/pint --test

      - name: Run Laravel tests
        working-directory: backend
        run: php artisan test

      - name: Verify API v1 routes
        working-directory: backend
        run: php artisan route:list --path=api/v1
