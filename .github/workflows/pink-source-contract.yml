name: Flutter Preview · Pink Source Contract

on:
  push:
    branches:
      - main
      - 'agent/limg-pink-*'
      - 'agent/pinksrc-*'
    paths:
      - 'docs/ui/PINK_SOURCE_EXTRACTION_CONTRACT.json'
      - 'docs/ui/PRODUCTION_SOURCE_ADMISSION.json'
      - 'docs/ui/PRODUCTION_ASSET_PROVENANCE.json'
      - 'mobile/lib/design_system/components/media/walka_product_media_admission.dart'
      - 'mobile/tool/src/pink_source_contract.dart'
      - 'mobile/tool/verify_pink_source_contract.dart'
      - 'mobile/test/pinksrc_001_020_source_contract_test.dart'
      - 'docs/work/PINKSRC-001-020.md'
      - '.github/workflows/pink-source-contract.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pink-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Pink source extraction contract
        id: pinksrc
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          report='pink-source-contract-report.json'
          dart run tool/verify_pink_source_contract.dart \
            --root . \
            --json "$report" \
            --report
          state="$(python3 -c "import json; print(json.load(open('$report'))['state'])")"
          admitted="$(python3 -c "import json; print(str(json.load(open('$report'))['productionAdmitted']).lower())")"
          blocker_count="$(python3 -c "import json; print(json.load(open('$report'))['blockerCount'])")"
          report_sha="$(sha256sum "$report" | awk '{print $1}')"
          {
            echo '### Pink source extraction contract'
            echo
            echo "- State: **$state**"
            echo "- Production admitted: **$admitted**"
            echo "- Contract blockers: **$blocker_count**"
            echo "- Report SHA-256: \`$report_sha\`"
            echo '- Meaning: Pink source/panel identity is locked; runtime admission is accepted only when canonical fingerprint, provenance, all nine visual QA checks and runtime state agree.'
            echo '- Global stable owner-visible publication remains governed by the five-variant release gate and final owner visual acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pink source contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pink-source-contract-${{ github.sha }}
          path: mobile/pink-source-contract-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Pink source extraction contract
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          report = json.load(open('pink-source-contract-report.json'))
          if not report['contractReady']:
              for violation in report['violations']:
                  print(f"BLOCKER {violation['code']}: {violation['message']}")
              raise SystemExit(1)
          print(
              'Pink source contract is consistent: '
              f"state={report['state']} admitted={report['productionAdmitted']}"
          )
          PY
