name: Deploy Mobile Web Production

on:
  push:
    branches:
      - production
    paths:
      - 'mobile/**'
      - 'docs/ui/PRODUCTION_SOURCE_ADMISSION.json'
      - '.github/workflows/deploy-mobile-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: walka-mobile-web-production
  cancel-in-progress: false

env:
  SITE_URL: https://mobile.walkastore.com
  WALKA_API_BASE_URL: https://api.walkastore.com

jobs:
  validate-build-deploy:
    name: Validate, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout production
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web runner
        working-directory: mobile
        run: flutter create --platforms=web --project-name walka .

      - name: Get packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Verify production API contract and CORS
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --max-time 20 \
            "$WALKA_API_BASE_URL/api/v1/health" \
            --output /tmp/walka-health.json
          grep -q '"status":"ok"' /tmp/walka-health.json
          grep -q '"service":"walka-api"' /tmp/walka-health.json

          curl --fail --silent --show-error --location \
            --max-time 20 \
            -H "Origin: $SITE_URL" \
            -D /tmp/walka-cors.headers \
            "$WALKA_API_BASE_URL/api/v1/catalog" \
            --output /tmp/walka-catalog.json
          grep -q '"drawer-organizer"' /tmp/walka-catalog.json
          grep -q '"stainless-steel-bento-lunch-box"' /tmp/walka-catalog.json

          if ! grep -Eiq '^access-control-allow-origin:[[:space:]]*(\*|https://mobile\.walkastore\.com)[[:space:]]*$' /tmp/walka-cors.headers; then
            echo 'Production API did not return a CORS allow-origin header for mobile.walkastore.com.' >&2
            sed -n '1,40p' /tmp/walka-cors.headers >&2
            exit 1
          fi

          echo 'Production API health, catalog contract, and CORS checks passed.'

      - name: Report production product assets
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          bash tool/verify_production_assets.sh \
            --report \
            --root . \
            --manifest ../docs/ui/PRODUCTION_SOURCE_ADMISSION.json \
            --json production-asset-readiness-production.json

      - name: Upload production asset readiness report
        uses: actions/upload-artifact@v4
        with:
          name: walka-mobile-web-asset-readiness-${{ github.sha }}
          path: mobile/production-asset-readiness-production.json
          if-no-files-found: error
          retention-days: 14

      - name: Build Flutter web release
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          echo "Building production web against $WALKA_API_BASE_URL"
          flutter build web --release \
            --dart-define="WALKA_API_BASE_URL=${WALKA_API_BASE_URL}"

      - name: Prepare GitHub Pages static hosting
        shell: bash
        run: |
          set -euo pipefail
          touch mobile/build/web/.nojekyll
          cp mobile/build/web/index.html mobile/build/web/404.html

      - name: Upload production web artifact
        uses: actions/upload-artifact@v4
        with:
          name: walka-mobile-web-production-${{ github.sha }}
          path: mobile/build/web
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location \
              --max-time 20 \
              "$SITE_URL/" \
              --output /tmp/walka-mobile-home.html; then
              grep -qi '<html' /tmp/walka-mobile-home.html
              echo "Production smoke test passed on attempt $attempt."
              exit 0
            fi
            sleep 10
          done
          echo 'Production smoke test failed after GitHub Pages deployment.' >&2
          exit 1
