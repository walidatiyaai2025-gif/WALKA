name: Deploy Mobile Web Production

on:
  push:
    branches:
      - production
    paths:
      - 'mobile/**'
      - 'docs/ui/PRODUCTION_SOURCE_ADMISSION.json'
      - '.github/workflows/deploy-mobile-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: walka-mobile-web-production
  cancel-in-progress: false

env:
  SITE_URL: https://mobile.walkastore.com

jobs:
  validate-build-deploy:
    name: Validate, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout production
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web runner
        working-directory: mobile
        run: flutter create --platforms=web --project-name walka .

      - name: Get packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Report production product assets
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          bash tool/verify_production_assets.sh \
            --report \
            --root . \
            --manifest ../docs/ui/PRODUCTION_SOURCE_ADMISSION.json \
            --json production-asset-readiness-production.json

      - name: Upload production asset readiness report
        uses: actions/upload-artifact@v4
        with:
          name: walka-mobile-web-asset-readiness-${{ github.sha }}
          path: mobile/production-asset-readiness-production.json
          if-no-files-found: error
          retention-days: 14

      - name: Build Flutter web release
        working-directory: mobile
        shell: bash
        env:
          WALKA_API_BASE_URL: ${{ vars.WALKA_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -n "${WALKA_API_BASE_URL:-}" ]]; then
            echo 'Building production web with configured WALKA API base URL.'
            flutter build web --release \
              --dart-define="WALKA_API_BASE_URL=${WALKA_API_BASE_URL}"
          else
            echo 'WALKA_API_BASE_URL repository variable is not set; building with bundled catalog fallback.'
            flutter build web --release
          fi

      - name: Prepare GitHub Pages static hosting
        shell: bash
        run: |
          set -euo pipefail
          touch mobile/build/web/.nojekyll
          cp mobile/build/web/index.html mobile/build/web/404.html

      - name: Upload production web artifact
        uses: actions/upload-artifact@v4
        with:
          name: walka-mobile-web-production-${{ github.sha }}
          path: mobile/build/web
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location \
              --max-time 20 \
              "$SITE_URL/" \
              --output /tmp/walka-mobile-home.html; then
              grep -qi '<html' /tmp/walka-mobile-home.html
              echo "Production smoke test passed on attempt $attempt."
              exit 0
            fi
            sleep 10
          done
          echo 'Production smoke test failed after GitHub Pages deployment.' >&2
          exit 1
