name: CMS-021 Pint Autofix

on:
  push:
    branches:
      - agent/cms-021-home-layout
    paths:
      - 'backend/**/*.php'
      - '.github/workflows/cms-021-pint-autofix.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CMS-021
        uses: actions/checkout@v4
        with:
          ref: agent/cms-021-home-layout
          fetch-depth: 0

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply Laravel Pint
        working-directory: backend
        run: vendor/bin/pint

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- backend; then
            echo "Pint made no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "CMS-021: apply Laravel Pint formatting [skip ci]"
          git push origin HEAD:agent/cms-021-home-layout
