name: cPanel Production Access

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cpanel-production-access.yml'

permissions:
  contents: read

concurrency:
  group: walka-cpanel-production-access
  cancel-in-progress: false

jobs:
  ssh-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Install SSH password client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

      - name: Verify shell access without changing production
        shell: bash
        env:
          SSH_HOST: server11.hhost.host
          SSH_USER: solscool
          SSHPASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "${SSHPASS:-}" ]] || { echo 'Missing CPANEL_FTP_PASSWORD' >&2; exit 1; }
          timeout 25 sshpass -e ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=12 \
            "${SSH_USER}@${SSH_HOST}" \
            'printf "WALKA_SSH_OK\n"; pwd; php -r '\''echo PHP_VERSION, PHP_EOL;'\'''
