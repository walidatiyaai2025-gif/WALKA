name: cPanel Production Access

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cpanel-production-access.yml'

permissions:
  contents: read

concurrency:
  group: walka-cpanel-production-access
  cancel-in-progress: false

jobs:
  ftps-root-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp >/dev/null

      - name: Inspect restricted FTPS root without mutation
        shell: bash
        env:
          FTP_HOST: ftp.50sols.com
          FTP_USER: mobile@walkastore.com
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "${FTP_PASSWORD:-}" ]] || { echo 'Missing CPANEL_FTP_PASSWORD' >&2; exit 1; }
          rm -rf /tmp/walka-ftps-inspect
          mkdir -p /tmp/walka-ftps-inspect
          lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 "$FTP_HOST" -e "
            set cmd:fail-exit yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ssl:check-hostname no;
            set ftp:passive-mode true;
            set net:max-retries 1;
            set net:timeout 15;
            pwd;
            cls -la;
            get .git/config -o /tmp/walka-ftps-inspect/git-config;
            get .htaccess -o /tmp/walka-ftps-inspect/htaccess;
            bye;
          "
          echo '--- .git/config (sanitized known-safe fields) ---'
          grep -E '^\s*(url|branch|merge)\s*=' /tmp/walka-ftps-inspect/git-config || true
          echo '--- .htaccess ---'
          sed -n '1,160p' /tmp/walka-ftps-inspect/htaccess
