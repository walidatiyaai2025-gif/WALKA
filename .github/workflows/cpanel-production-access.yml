name: cPanel Production Access

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cpanel-production-access.yml'

permissions:
  contents: read

concurrency:
  group: walka-cpanel-production-access
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Verify cPanel UAPI through service subdomains
        shell: bash
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_USER: solscool
        run: |
          set -euo pipefail
          [[ -n "${CPANEL_API_TOKEN:-}" ]] || { echo 'Missing CPANEL_API_TOKEN' >&2; exit 1; }

          success=0
          for base in \
            'https://cpanel.50sols.com' \
            'https://cpanel.walkastore.com'
          do
            echo "Probing ${base}"
            body="$(mktemp)"
            headers="$(mktemp)"
            status="$(curl --silent --show-error --location \
              --connect-timeout 12 \
              --max-time 25 \
              --header "Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
              --header 'Accept: application/json' \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              "${base}/execute/Fileman/list_files?dir=public_html%2Fapi.walkastore.com&show_hidden=0" || true)"
            echo "HTTP ${status}"

            if jq -e '.result.status == 1' "$body" >/dev/null 2>&1; then
              echo "cPanel UAPI reachable via ${base}."
              printf '%s' "$base" > /tmp/cpanel-base-url.txt
              success=1
              break
            fi

            if jq -e . "$body" >/dev/null 2>&1; then
              jq -c '{result:{status:.result.status,errors:.result.errors,messages:.result.messages}}' "$body"
            else
              title="$(grep -oEi '<title[^>]*>[^<]*</title>' "$body" | head -1 || true)"
              echo "Non-JSON response: ${title:-no HTML title}"
            fi
          done

          test "$success" = 1
