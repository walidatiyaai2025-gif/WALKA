name: cPanel Production Access

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cpanel-production-access.yml'

permissions:
  contents: read

concurrency:
  group: walka-cpanel-production-access
  cancel-in-progress: false

jobs:
  ftps-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp >/dev/null

      - name: Verify FTPS data channel via service hostname
        shell: bash
        env:
          FTP_HOST: ftp.50sols.com
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "${FTP_PASSWORD:-}" ]] || { echo 'Missing CPANEL_FTP_PASSWORD' >&2; exit 1; }
          for FTP_USER in 'solscool' 'mobile@walkastore.com'; do
            echo "Testing FTPS user ${FTP_USER}"
            set +e
            timeout 35 lftp \
              -u "$FTP_USER","$FTP_PASSWORD" \
              -p 21 \
              "$FTP_HOST" \
              -e "
                set cmd:fail-exit yes;
                set ftp:ssl-force true;
                set ftp:ssl-protect-data true;
                set ssl:verify-certificate yes;
                set ssl:check-hostname no;
                set ftp:passive-mode true;
                set net:max-retries 1;
                set net:timeout 12;
                pwd;
                cls -1;
                bye;
              "
            status=$?
            set -e
            if [[ "$status" = 0 ]]; then
              echo "FTPS usable for ${FTP_USER}."
              exit 0
            fi
            echo "FTPS probe failed for ${FTP_USER} with status ${status}."
          done
          exit 1
