name: cPanel Production Access

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cpanel-production-access.yml'

permissions:
  contents: read

concurrency:
  group: walka-cpanel-production-access
  cancel-in-progress: false

jobs:
  php84-cli-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: production
    steps:
      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp >/dev/null

      - name: Create protected PHP CLI probe
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          name=".walka-probe-$(openssl rand -hex 10).php"
          echo "::add-mask::$token"
          printf '%s' "$token" > /tmp/walka-probe-token
          printf '%s' "$name" > /tmp/walka-probe-name
          cat > /tmp/walka-probe.php <<'PHP'
          <?php
          declare(strict_types=1);
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');
          $expected = trim((string) @file_get_contents(__DIR__ . '/.walka-probe-token'));
          $provided = (string) ($_SERVER['HTTP_X_WALKA_DEPLOY_TOKEN'] ?? '');
          if ($expected === '' || !hash_equals($expected, $provided)) {
              http_response_code(404);
              echo json_encode(['ok' => false]);
              exit;
          }
          $candidates = [
              '/opt/cpanel/ea-php84/root/usr/bin/php',
              '/usr/local/bin/ea-php84',
              '/usr/bin/ea-php84',
              '/usr/local/cpanel/3rdparty/bin/php',
              '/usr/bin/php',
          ];
          $results = [];
          foreach ($candidates as $candidate) {
              $entry = [
                  'path' => $candidate,
                  'exists' => is_file($candidate),
                  'executable' => is_executable($candidate),
                  'version' => null,
                  'exit' => null,
              ];
              if ($entry['executable'] && function_exists('proc_open')) {
                  $descriptors = [0 => ['pipe', 'r'], 1 => ['pipe', 'w'], 2 => ['pipe', 'w']];
                  $process = @proc_open([$candidate, '-r', 'echo PHP_VERSION;'], $descriptors, $pipes, __DIR__, null, ['bypass_shell' => true]);
                  if (is_resource($process)) {
                      fclose($pipes[0]);
                      $stdout = stream_get_contents($pipes[1]);
                      $stderr = stream_get_contents($pipes[2]);
                      fclose($pipes[1]);
                      fclose($pipes[2]);
                      $exit = proc_close($process);
                      $entry['exit'] = $exit;
                      if ($exit === 0) $entry['version'] = trim((string) $stdout);
                      elseif ($stderr !== '') $entry['error'] = substr(trim((string) $stderr), 0, 300);
                  }
              }
              $results[] = $entry;
          }
          $selected = null;
          foreach ($results as $entry) {
              if ($entry['exit'] === 0 && is_string($entry['version']) && version_compare($entry['version'], '8.4.1', '>=')) {
                  $selected = $entry['path'];
                  break;
              }
          }
          echo json_encode([
              'ok' => $selected !== null,
              'web_php' => PHP_VERSION,
              'php_binary' => PHP_BINARY,
              'selected' => $selected,
              'candidates' => $results,
          ], JSON_UNESCAPED_SLASHES);
          PHP

      - name: Upload probe over FTPS
        shell: bash
        env:
          FTP_HOST: ftp.50sols.com
          FTP_USER: mobile@walkastore.com
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          name="$(cat /tmp/walka-probe-name)"
          lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 "$FTP_HOST" -e "
            set cmd:fail-exit yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ssl:check-hostname no;
            set ftp:passive-mode true;
            set net:max-retries 1;
            set net:timeout 15;
            put /tmp/walka-probe.php -o $name;
            put /tmp/walka-probe-token -o .walka-probe-token;
            bye;
          "

      - name: Invoke probe through cPanel vhost
        shell: bash
        run: |
          set -euo pipefail
          name="$(cat /tmp/walka-probe-name)"
          token="$(cat /tmp/walka-probe-token)"
          response="$(curl --silent --show-error --fail \
            --resolve mobile.walkastore.com:443:65.21.208.232 \
            --max-time 25 \
            -H "X-WALKA-Deploy-Token: $token" \
            "https://mobile.walkastore.com/$name")"
          printf '%s\n' "$response" | jq .
          printf '%s' "$response" > /tmp/walka-probe-response.json
          jq -e '.ok == true and (.selected | type == "string")' /tmp/walka-probe-response.json >/dev/null

      - name: Remove one-shot probe
        if: always()
        shell: bash
        env:
          FTP_HOST: ftp.50sols.com
          FTP_USER: mobile@walkastore.com
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set +e
          name="$(cat /tmp/walka-probe-name 2>/dev/null)"
          [[ -n "$name" ]] || exit 0
          timeout 30 lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 "$FTP_HOST" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ssl:check-hostname no;
            set ftp:passive-mode true;
            set net:max-retries 1;
            set net:timeout 10;
            rm -f $name;
            rm -f .walka-probe-token;
            bye;
          "
          exit 0
