name: STATE-001 Branch Patch

on:
  push:
    branches:
      - agent/state-001-persistent-favorites
    paths:
      - '.github/workflows/state-001-branch-patch.yml'

permissions:
  contents: write

jobs:
  patch-pdp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/state-001-persistent-favorites

      - name: Wire persistent Favorites into PDP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mobile/lib/features/storefront/storefront_v2.dart')
          text = path.read_text()

          old_import = "import '../commerce/amazon_purchase.dart';\n"
          new_import = old_import + "import '../favorites/favorites_state.dart';\n"
          assert old_import in text and "favorites/favorites_state.dart" not in text
          text = text.replace(old_import, new_import, 1)

          old_state = """class _WalkaProductDetailV2State extends State<WalkaProductDetailV2> {\n  late bool _gray = widget.initialGray;\n  int _galleryIndex = 0;\n\n  @override\n  Widget build(BuildContext context) {\n    final Color productTone = _gray\n        ? const Color(0xFFD9DCE0)\n        : const Color(0xFFF7F4ED);\n\n    return Scaffold(\n"""
          new_state = """class _WalkaProductDetailV2State extends State<WalkaProductDetailV2> {\n  late bool _gray = widget.initialGray;\n  int _galleryIndex = 0;\n\n  Future<void> _toggleFavorite(\n    BuildContext context,\n    WalkaFavoritesController controller,\n  ) async {\n    final bool saved = await controller.toggleDrawer(gray: _gray);\n    if (!mounted || saved) {\n      return;\n    }\n    ScaffoldMessenger.of(context).showSnackBar(\n      const SnackBar(\n        content: Text('Favorite could not be updated. Please try again.'),\n      ),\n    );\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    final Color productTone = _gray\n        ? const Color(0xFFD9DCE0)\n        : const Color(0xFFF7F4ED);\n    final WalkaFavoritesController favorites = WalkaFavoritesScope.of(context);\n    final bool isFavorite = favorites.isDrawerFavorite(gray: _gray);\n\n    return Scaffold(\n"""
          assert old_state in text
          text = text.replace(old_state, new_state, 1)

          old_button = """          IconButton(\n            onPressed: () {},\n            tooltip: 'Favorite',\n            icon: const Icon(Icons.favorite_border_rounded),\n          ),\n"""
          new_button = """          IconButton(\n            onPressed: () => _toggleFavorite(context, favorites),\n            tooltip: isFavorite ? 'Remove favorite' : 'Add favorite',\n            icon: Icon(\n              isFavorite\n                  ? Icons.favorite_rounded\n                  : Icons.favorite_border_rounded,\n            ),\n          ),\n"""
          assert old_button in text
          text = text.replace(old_button, new_button, 1)

          path.write_text(text)
          PY

      - name: Commit branch patch
        shell: bash
        run: |
          git config user.name "WALKA Team Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/lib/features/storefront/storefront_v2.dart
          git commit -m "STATE-001: connect PDP favorite control"
          git push origin HEAD:agent/state-001-persistent-favorites
