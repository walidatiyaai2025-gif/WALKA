name: LIMG Blue canonical materializer

on:
  push:
    branches:
      - agent/limg-blue-001-100-admission
    paths:
      - 'docs/tmp/limg-blue/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install pinned image tooling
        run: python -m pip install --disable-pip-version-check 'Pillow==12.3.0'

      - name: Materialize canonical Blue from approved source evidence
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import base64
          import hashlib
          import json
          import pathlib
          import zlib
          from PIL import Image

          root = pathlib.Path('.')
          tmp = root / 'docs/tmp/limg-blue'
          source_b64 = ''.join(p.read_text().strip() for p in sorted((tmp / 'source').glob('*.b64')))
          alpha_b64 = ''.join(p.read_text().strip() for p in sorted((tmp / 'alpha').glob('*.b64')))
          source = base64.b64decode(source_b64)
          alpha_raw = zlib.decompress(base64.b64decode(alpha_b64))

          expected_source_sha = '1ad36a3c917ea7e0e4dbadfd68070e4ebc1392cf78217fd860640e1a3d68077e'
          if hashlib.sha256(source).hexdigest() != expected_source_sha:
              raise SystemExit('approved source SHA-256 mismatch')
          if len(source) != 71422:
              raise SystemExit(f'approved source byte-size mismatch: {len(source)}')
          if len(alpha_raw) != 1024 * 1024:
              raise SystemExit(f'alpha payload mismatch: {len(alpha_raw)}')

          source_path = tmp / 'main new(3).jpg'
          source_path.write_bytes(source)
          src = Image.open(source_path).convert('RGB')
          if src.size != (1024, 1024):
              raise SystemExit(f'approved source dimensions mismatch: {src.size}')

          resized = src.resize((922, 922), Image.Resampling.LANCZOS)
          canvas = Image.new('RGB', (1024, 1024))
          canvas.paste(resized, (51, 51))
          rgba = canvas.convert('RGBA')
          alpha = Image.frombytes('L', (1024, 1024), alpha_raw)
          rgba.putalpha(alpha)

          icc_b64 = ''
          icc = base64.b64decode(icc_b64)
          if len(icc) != 588:
              raise SystemExit(f'sRGB ICC payload mismatch: {len(icc)}')

          out = root / 'mobile/assets/products/lunch/blue.png'
          out.parent.mkdir(parents=True, exist_ok=True)
          rgba.save(out, format='PNG', icc_profile=icc, optimize=False)

          data = out.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          byte_size = len(data)
          if byte_size > 1258291:
              raise SystemExit(f'canonical Blue exceeds hard file budget: {byte_size}')

          bbox_exclusive = rgba.getchannel('A').getbbox()
          if bbox_exclusive is None:
              raise SystemExit('canonical Blue alpha is empty')
          l, t, r_ex, b_ex = bbox_exclusive
          r, b = r_ex - 1, b_ex - 1
          margin = min(l, t, 1023 - r, 1023 - b)
          if (l, t, r, b) != (81, 99, 935, 852):
              raise SystemExit(f'alpha bounds changed: {(l, t, r, b)}')
          if margin < 52:
              raise SystemExit(f'transparent safe margin below 5%: {margin}px')

          source_manifest = root / 'docs/ui/PRODUCTION_SOURCE_ADMISSION.json'
          source_json = json.loads(source_manifest.read_text())
          src_row = next(v for v in source_json['variants'] if v['variantId'] == 'lunch-box:blue')
          src_row['canonicalExportPresent'] = True
          src_row['canonicalSha256'] = digest
          src_row['canonicalByteSize'] = byte_size
          source_manifest.write_text(json.dumps(source_json, indent=2, ensure_ascii=False) + '\n')

          provenance_path = root / 'docs/ui/PRODUCTION_ASSET_PROVENANCE.json'
          provenance = json.loads(provenance_path.read_text())
          row = next(v for v in provenance['variants'] if v['variantId'] == 'lunch-box:blue')
          row['lifecycleState'] = 'ADMITTED'
          row['sha256'] = digest
          row['byteSize'] = byte_size
          row['width'] = 1024
          row['height'] = 1024
          row['alphaBoundingBox'] = [81, 99, 935, 852]
          row['nearestTransparentSafeMargin'] = 81
          provenance_path.write_text(json.dumps(provenance, indent=2, ensure_ascii=False) + '\n')

          print(f'canonical_sha256={digest}')
          print(f'canonical_bytes={byte_size}')
          print('alpha_bbox=[81,99,935,852]')
          print('safe_margin_px=81')
          PY

      - name: Commit canonical binary and remove transport evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/tmp/limg-blue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/assets/products/lunch/blue.png docs/ui/PRODUCTION_SOURCE_ADMISSION.json docs/ui/PRODUCTION_ASSET_PROVENANCE.json docs/tmp/limg-blue
          git diff --cached --stat
          git commit -m 'LIMG-BLUE: materialize admitted canonical Blue binary'
          git push origin HEAD:${{ github.ref_name }}
