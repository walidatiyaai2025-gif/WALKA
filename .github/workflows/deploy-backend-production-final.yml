name: Deploy Corrected Backend Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-backend-production-final.yml'

permissions:
  contents: read

env:
  BACKEND_SOURCE_SHA: 3022bbe48beedd07cd8d51850b29d54b39d0e9d7
  PREVIOUS_SOURCE_SHA: 38b6f6d9623a0c0816734989e706795a829844f7
  RELEASE_ID: 38b6f6d9623a
  API_URL: https://api.walkastore.com

concurrency:
  group: walka-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://api.walkastore.com
    steps:
      - name: Checkout exact corrected backend source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BACKEND_SOURCE_SHA }}
          fetch-depth: 1

      - name: Prepare migration patch checksum
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          file='backend/database/migrations/2026_08_13_000003_create_media_gallery_assignment_tables.php'
          sha="$(sha256sum "$file" | awk '{print $1}')"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          cp "$file" /tmp/walka-migration-patch.php
          echo "Migration patch SHA256: $sha"

      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp >/dev/null

      - name: Create protected production bridge
        shell: bash
        env:
          PATCH_SHA256: ${{ steps.patch.outputs.sha256 }}
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          bridge=".walka-final-$(openssl rand -hex 12).php"
          echo "::add-mask::$token"
          printf '%s' "$token" > /tmp/walka-deploy-token
          printf '%s' "$bridge" > /tmp/walka-deploy-name
          cat > /tmp/walka-deploy.php <<'PHP'
          <?php
          declare(strict_types=1);
          set_time_limit(240);
          ignore_user_abort(true);
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');

          $expectedToken = trim((string) @file_get_contents(__DIR__ . '/.walka-deploy-token'));
          $providedToken = (string) ($_SERVER['HTTP_X_WALKA_DEPLOY_TOKEN'] ?? '');
          if ($expectedToken === '' || !hash_equals($expectedToken, $providedToken)) {
              http_response_code(404);
              echo json_encode(['ok' => false]);
              exit;
          }

          $expectedSha = '__SOURCE_SHA__';
          $previousSha = '__PREVIOUS_SHA__';
          $release = '__RELEASE__';
          $expectedPatchSha = '__PATCH_SHA__';
          $home = '/home/solscool';
          $target = $home . '/walka_backend';
          $public = $home . '/public_html/api.walkastore.com';
          $stage = $home . '/walka_backend_stage_' . $release;
          $backup = $home . '/walka_backend_backup_' . $release;
          $failed = $home . '/walka_backend_failed_' . $release;
          $publicBuild = $public . '/build';
          $publicBuildStage = $public . '/build_stage_' . $release;
          $publicBuildBackup = $public . '/build_backup_' . $release;
          $patchSource = __DIR__ . '/.walka-migration-patch.php';
          $patchTarget = $stage . '/database/migrations/2026_08_13_000003_create_media_gallery_assignment_tables.php';
          $php = '/opt/cpanel/ea-php84/root/usr/bin/php';

          $lock = fopen(__DIR__ . '/.walka-deploy.lock', 'c');
          if ($lock === false || !flock($lock, LOCK_EX | LOCK_NB)) {
              http_response_code(409);
              echo json_encode(['ok' => false, 'error' => 'deployment_already_running']);
              exit;
          }

          function runCommand(array $command, string $cwd, int $timeoutSeconds = 150): array {
              $descriptors = [0 => ['pipe', 'r'], 1 => ['pipe', 'w'], 2 => ['pipe', 'w']];
              $process = proc_open($command, $descriptors, $pipes, $cwd, null, ['bypass_shell' => true]);
              if (!is_resource($process)) throw new RuntimeException('Unable to start command');
              fclose($pipes[0]);
              stream_set_blocking($pipes[1], false);
              stream_set_blocking($pipes[2], false);
              $stdout = '';
              $stderr = '';
              $started = microtime(true);
              $status = ['exitcode' => -1];
              while (true) {
                  $stdout .= (string) stream_get_contents($pipes[1]);
                  $stderr .= (string) stream_get_contents($pipes[2]);
                  $status = proc_get_status($process);
                  if (!$status['running']) break;
                  if ((microtime(true) - $started) > $timeoutSeconds) {
                      proc_terminate($process, 15);
                      throw new RuntimeException('Command timed out');
                  }
                  usleep(100000);
              }
              $stdout .= (string) stream_get_contents($pipes[1]);
              $stderr .= (string) stream_get_contents($pipes[2]);
              fclose($pipes[1]); fclose($pipes[2]);
              $exitCode = proc_close($process);
              if ($exitCode === -1) $exitCode = (int) ($status['exitcode'] ?? -1);
              $output = trim($stdout . ($stderr === '' ? '' : "\n" . $stderr));
              if ($exitCode !== 0) throw new RuntimeException('Command failed (' . $exitCode . '): ' . substr($output, 0, 6000));
              return ['exit' => $exitCode, 'output' => substr($output, 0, 6000)];
          }

          $appSwapped = false;
          $buildSwapped = false;
          try {
              if (!is_file($php) || !is_executable($php)) throw new RuntimeException('cPanel PHP 8.4 CLI unavailable');
              $phpVersion = runCommand([$php, '-r', 'echo PHP_VERSION;'], __DIR__, 15)['output'];
              if (version_compare($phpVersion, '8.4.1', '<')) throw new RuntimeException('PHP CLI too old: ' . $phpVersion);

              foreach ([$target . '/artisan', $target . '/.env', $target . '/vendor/autoload.php', $public . '/index.php'] as $required) {
                  if (!is_file($required)) throw new RuntimeException('Required live file missing: ' . $required);
              }
              foreach ([$stage . '/artisan', $stage . '/vendor/autoload.php', $stage . '/bootstrap/app.php', $stage . '/public/build/manifest.json', $stage . '/.walka-source-sha'] as $required) {
                  if (!is_file($required)) throw new RuntimeException('Required staging file missing: ' . $required);
              }
              $stageSha = trim((string) file_get_contents($stage . '/.walka-source-sha'));
              if (!hash_equals($previousSha, $stageSha)) throw new RuntimeException('Unexpected staging source SHA: ' . $stageSha);
              if (!is_file($patchSource) || !hash_equals($expectedPatchSha, hash_file('sha256', $patchSource))) throw new RuntimeException('Migration patch checksum mismatch');
              if (!copy($patchSource, $patchTarget)) throw new RuntimeException('Unable to install corrected migration into staging');
              if (!hash_equals($expectedPatchSha, hash_file('sha256', $patchTarget))) throw new RuntimeException('Installed migration checksum mismatch');
              file_put_contents($stage . '/.walka-source-sha', $expectedSha . "\n");

              if (!copy($target . '/.env', $stage . '/.env')) throw new RuntimeException('Unable to refresh production env in staging');
              runCommand(['/bin/rm', '-rf', $stage . '/storage'], __DIR__, 60);
              runCommand(['/bin/cp', '-a', $target . '/storage', $stage . '/storage'], __DIR__, 60);
              runCommand(['/bin/chmod', '-R', 'u+rwX,g+rwX', $stage . '/storage'], __DIR__, 60);
              runCommand(['/bin/chmod', '-R', 'u+rwX,g+rwX', $stage . '/bootstrap/cache'], __DIR__, 60);
              runCommand(['/bin/rm', '-rf', $publicBuildStage], __DIR__, 30);
              runCommand(['/bin/cp', '-a', $stage . '/public/build', $publicBuildStage], __DIR__, 60);

              // Recover only the known failed CREATE TABLE if MySQL left it behind.
              // If it contains data, stop instead of dropping anything.
              $repairScript = <<<'PHPREPAIR'
          require $argv[1] . '/vendor/autoload.php';
          $app = require $argv[1] . '/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db = $app->make('db')->connection();
          $schema = $db->getSchemaBuilder();
          $migration = '2026_08_13_000003_create_media_gallery_assignment_tables';
          $recorded = (int) $db->table('migrations')->where('migration', $migration)->count() > 0;
          $product = $schema->hasTable('product_media_gallery_items');
          $variant = $schema->hasTable('variant_media_gallery_items');
          $variantRows = $variant ? (int) $db->table('variant_media_gallery_items')->count() : 0;
          if (!$recorded && $variant && $variantRows === 0) {
              $schema->drop('variant_media_gallery_items');
              $variant = false;
          }
          echo json_encode(['recorded'=>$recorded,'product_table'=>$product,'variant_table_after_recovery'=>$variant,'variant_rows'=>$variantRows], JSON_UNESCAPED_SLASHES);
          PHPREPAIR;
              $repair = runCommand([$php, '-r', $repairScript, $stage], $stage, 60);

              $migrate = runCommand([$php, $stage . '/artisan', 'migrate', '--force', '--no-interaction', '--no-ansi'], $stage, 150);
              runCommand([$php, $stage . '/artisan', 'optimize:clear', '--no-ansi'], $stage, 90);
              runCommand([$php, $stage . '/artisan', 'config:cache', '--no-ansi'], $stage, 90);
              runCommand([$php, $stage . '/artisan', 'route:cache', '--no-ansi'], $stage, 90);
              runCommand([$php, $stage . '/artisan', 'view:cache', '--no-ansi'], $stage, 90);
              $precheck = runCommand([$php, $stage . '/artisan', 'walka:production-check', '--no-ansi'], $stage, 120);

              if (file_exists($backup)) runCommand(['/bin/rm', '-rf', $backup], __DIR__, 90);
              if (!rename($target, $backup)) throw new RuntimeException('Unable to backup current backend');
              if (!rename($stage, $target)) {
                  @rename($backup, $target);
                  throw new RuntimeException('Unable to activate staged backend; live backend restored');
              }
              $appSwapped = true;

              if (file_exists($publicBuildBackup)) runCommand(['/bin/rm', '-rf', $publicBuildBackup], __DIR__, 60);
              if (file_exists($publicBuild) && !rename($publicBuild, $publicBuildBackup)) throw new RuntimeException('Unable to backup public build assets');
              if (!rename($publicBuildStage, $publicBuild)) {
                  if (file_exists($publicBuildBackup)) @rename($publicBuildBackup, $publicBuild);
                  throw new RuntimeException('Unable to activate public build assets');
              }
              $buildSwapped = true;
              if (is_file($target . '/public/favicon.ico')) @copy($target . '/public/favicon.ico', $public . '/favicon.ico');
              if (is_file($target . '/public/robots.txt')) @copy($target . '/public/robots.txt', $public . '/robots.txt');
              if (function_exists('opcache_reset')) @opcache_reset();
              $postcheck = runCommand([$php, $target . '/artisan', 'walka:production-check', '--no-ansi'], $target, 120);

              echo json_encode([
                  'ok' => true,
                  'source_sha' => trim((string) file_get_contents($target . '/.walka-source-sha')),
                  'php_cli' => $phpVersion,
                  'schema_recovery' => json_decode($repair['output'], true),
                  'migration_output' => $migrate['output'],
                  'precheck' => $precheck['output'],
                  'postcheck' => $postcheck['output'],
                  'backup' => basename($backup),
              ], JSON_UNESCAPED_SLASHES);
          } catch (Throwable $e) {
              if ($appSwapped) {
                  try {
                      if ($buildSwapped && file_exists($publicBuildBackup)) {
                          if (file_exists($publicBuild)) runCommand(['/bin/rm', '-rf', $publicBuild], __DIR__, 60);
                          @rename($publicBuildBackup, $publicBuild);
                      }
                      if (file_exists($target)) @rename($target, $failed);
                      if (file_exists($backup)) @rename($backup, $target);
                      if (function_exists('opcache_reset')) @opcache_reset();
                  } catch (Throwable) {}
              }
              http_response_code(500);
              echo json_encode(['ok'=>false,'error'=>substr($e->getMessage(),0,7000),'rolled_back_code'=>$appSwapped], JSON_UNESCAPED_SLASHES);
          } finally {
              if (is_resource($lock)) { @flock($lock, LOCK_UN); @fclose($lock); }
          }
          PHP
          sed -i \
            -e "s/__SOURCE_SHA__/$BACKEND_SOURCE_SHA/g" \
            -e "s/__PREVIOUS_SHA__/$PREVIOUS_SOURCE_SHA/g" \
            -e "s/__RELEASE__/$RELEASE_ID/g" \
            -e "s/__PATCH_SHA__/$PATCH_SHA256/g" \
            /tmp/walka-deploy.php

      - name: Upload corrected migration and bridge over FTPS
        shell: bash
        env:
          FTP_HOST: ftp.50sols.com
          FTP_USER: mobile@walkastore.com
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          bridge="$(cat /tmp/walka-deploy-name)"
          lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 "$FTP_HOST" -e "
            set cmd:fail-exit yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ssl:check-hostname no;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 20;
            put /tmp/walka-migration-patch.php -o .walka-migration-patch.php;
            put /tmp/walka-deploy.php -o $bridge;
            put /tmp/walka-deploy-token -o .walka-deploy-token;
            bye;
          "

      - name: Execute corrected production deployment
        shell: bash
        run: |
          set -euo pipefail
          bridge="$(cat /tmp/walka-deploy-name)"
          token="$(cat /tmp/walka-deploy-token)"
          http_code="$(curl --silent --show-error \
            --resolve mobile.walkastore.com:443:65.21.208.232 \
            --max-time 220 \
            -H "X-WALKA-Deploy-Token: $token" \
            -o /tmp/walka-deploy-response.json \
            -w '%{http_code}' \
            "https://mobile.walkastore.com/$bridge")"
          echo "Deployment bridge HTTP: $http_code"
          jq . /tmp/walka-deploy-response.json
          test "$http_code" = "200"
          jq -e --arg sha "$BACKEND_SOURCE_SHA" '.ok == true and .source_sha == $sha and (.php_cli | startswith("8.4."))' /tmp/walka-deploy-response.json >/dev/null

      - name: Production smoke tests
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "$API_URL/api/v1/health" -o /tmp/health.json
          jq . /tmp/health.json
          jq -e '.data.status == "ok" and .data.service == "walka-api"' /tmp/health.json >/dev/null

          curl --fail --silent --show-error --location --max-time 25 "$API_URL/api/v1/catalog" -o /tmp/catalog.json
          jq -e '.data != null' /tmp/catalog.json >/dev/null

          storefront_code="$(curl --silent --show-error --location --max-time 25 -o /tmp/storefront.json -w '%{http_code}' "$API_URL/api/v1/content/storefront")"
          echo "Storefront content HTTP: $storefront_code"
          if [[ "$storefront_code" = "200" ]]; then
            jq -e '.data.payload.information_json | type == "string" and length > 10' /tmp/storefront.json >/dev/null
            echo 'Dynamic information_json is published and readable.'
          elif [[ "$storefront_code" != "404" ]]; then
            cat /tmp/storefront.json
            exit 1
          fi

          related_code="$(curl --silent --show-error --location --max-time 25 -o /tmp/related.json -w '%{http_code}' "$API_URL/api/v1/content/related-products")"
          echo "Related products HTTP: $related_code"
          if [[ "$related_code" != "200" && "$related_code" != "404" ]]; then
            cat /tmp/related.json
            exit 1
          fi

      - name: Write deployment receipt
        if: success()
        shell: bash
        env:
          PATCH_SHA256: ${{ steps.patch.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p deployment-receipt
          cat > deployment-receipt/BACKEND_PRODUCTION_DEPLOYMENT.txt <<EOF
          WALKA Backend Production Deployment
          source_sha=$BACKEND_SOURCE_SHA
          previous_source_sha=$PREVIOUS_SOURCE_SHA
          workflow_sha=$GITHUB_SHA
          migration_patch_sha256=$PATCH_SHA256
          php_cli=/opt/cpanel/ea-php84/root/usr/bin/php
          target=/home/solscool/walka_backend
          public_root=/home/solscool/public_html/api.walkastore.com
          api_url=$API_URL
          deployed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          cp /tmp/walka-deploy-response.json deployment-receipt/server-response.json
          cp /tmp/health.json deployment-receipt/health.json

      - name: Upload deployment receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: walka-backend-production-${{ env.BACKEND_SOURCE_SHA }}
          path: deployment-receipt/
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup public deployment bridge
        if: always()
        shell: bash
        env:
          FTP_HOST: ftp.50sols.com
          FTP_USER: mobile@walkastore.com
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set +e
          bridge="$(cat /tmp/walka-deploy-name 2>/dev/null)"
          timeout 60 lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 "$FTP_HOST" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ssl:check-hostname no;
            set ftp:passive-mode true;
            set net:max-retries 1;
            set net:timeout 15;
            rm -f $bridge;
            rm -f .walka-deploy-token;
            rm -f .walka-deploy.lock;
            rm -f .walka-migration-patch.php;
            bye;
          "
          exit 0
