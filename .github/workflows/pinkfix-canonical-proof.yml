name: Pink Canonical Re-extraction Proof

on:
  push:
    branches:
      - 'agent/pinkfix-*'
  pull_request:
    paths:
      - 'design_sources/pink/**'
      - 'mobile/assets/products/lunch/pink.png'
      - 'mobile/tool/pinkfix_source_reextract.py'
      - 'mobile/tool/pinkfix_requirements.txt'
      - 'mobile/test/pinkfix_001_100_canonical_reextract_test.dart'
      - 'docs/ui/PINK_SOURCE_EXTRACTION_CONTRACT.json'
      - 'docs/ui/PRODUCTION_SOURCE_ADMISSION.json'
      - 'docs/ui/PRODUCTION_ASSET_PROVENANCE.json'
      - 'docs/work/PINKFIX_001_100_RECEIPT.json'
      - '.github/workflows/pinkfix-canonical-proof.yml'

permissions:
  contents: read

jobs:
  reproduce-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned image toolchain
        run: python -m pip install --disable-pip-version-check -r mobile/tool/pinkfix_requirements.txt

      - name: Verify locked source custody and canonical target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import importlib.util
          import json
          import numpy as np
          from PIL import Image

          root = Path.cwd()
          receipt = json.loads((root / 'docs/work/PINKFIX_001_100_RECEIPT.json').read_text())
          canonical = root / 'mobile/assets/products/lunch/pink.png'
          source = root / 'design_sources/pink/1000389975.jpg'
          expected_source_sha = '11a6020417067a8a1869eff1df90d0843f1e068a6cdc06d25e5c92abb1d2e3f5'
          expected_canonical_sha = '1667519c9a1931f16c8d26acefbed65e1f39ae7820ac58551de71a61a580d7fb'

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def require(label, actual, expected):
              print(f'{label}: actual={actual!r} expected={expected!r}')
              if actual != expected:
                  raise SystemExit(f'{label} mismatch: expected={expected!r} actual={actual!r}')

          src = receipt['source']
          require('receipt.source.sha256', src['sha256'], expected_source_sha)
          require('receipt.source.byteSize', src['byteSize'], 189515)
          require('receipt.source.dimensions', src['dimensions'], [695, 1536])
          require('receipt.source.approvedPanel', src['approvedPanel'], [28, 760, 647, 575])

          spec = importlib.util.spec_from_file_location(
              'pinkfix_source_reextract', root / 'mobile/tool/pinkfix_source_reextract.py'
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          require('tool.SOURCE_SHA256', module.SOURCE_SHA256, expected_source_sha)
          require('tool.SOURCE_BYTES', module.SOURCE_BYTES, 189515)
          require('tool.SOURCE_SIZE', list(module.SOURCE_SIZE), [695, 1536])
          require('tool.PANEL', list(module.PANEL), [28, 760, 647, 575])
          require('tool.EXPECTED_SHA256', module.EXPECTED_SHA256, expected_canonical_sha)
          require('tool.EXPECTED_BYTES', module.EXPECTED_BYTES, 749558)
          require('tool.EXPECTED_BBOX', module.EXPECTED_BBOX, [51, 125, 972, 898])
          require('tool.SAFE_MARGIN', module.SAFE_MARGIN, 51)

          actual_size = canonical.stat().st_size
          actual_sha = sha256(canonical)
          print(f'canonical path={canonical}')
          print(f'canonical size={actual_size}')
          print(f'canonical sha256={actual_sha}')
          require('canonical.byteSize', actual_size, 749558)
          require('canonical.sha256', actual_sha, expected_canonical_sha)

          image = Image.open(canonical).convert('RGBA')
          require('canonical.dimensions', list(image.size), [1024, 1024])
          alpha = np.asarray(image)[:, :, 3]
          ys, xs = np.where(alpha > 2)
          if len(xs) == 0:
              raise SystemExit('canonical alpha mask is empty')
          bbox = [int(xs.min()), int(ys.min()), int(xs.max()), int(ys.max())]
          margins = [bbox[0], bbox[1], 1023 - bbox[2], 1023 - bbox[3]]
          print(f'canonical bbox={bbox} margins={margins}')
          require('canonical.alphaBoundingBox', bbox, [51, 125, 972, 898])
          if min(margins) < 51:
              raise SystemExit(f'canonical safe-margin mismatch: expected>=51 actual={min(margins)} margins={margins}')
          srgb_present = b'sRGB' in canonical.read_bytes()
          require('canonical.sRGB', srgb_present, True)

          if source.exists():
              require('repositorySource.byteSize', source.stat().st_size, 189515)
              require('repositorySource.sha256', sha256(source), expected_source_sha)
              require('repositorySource.dimensions', list(Image.open(source).size), [695, 1536])
              mode = 'REPOSITORY_SOURCE_BYTE_FOR_BYTE'
          else:
              require('receipt.source.custody', receipt['source'].get('custody'), 'OWNER_FILE_LIBRARY_EXTERNAL')
              require('receipt.source.repositorySourcePresent', receipt['source'].get('repositorySourcePresent'), False)
              mode = 'EXTERNAL_SOURCE_CUSTODY_CANONICAL_LOCK'

          proof = {
              'proofMode': mode,
              'sourceSha256': expected_source_sha,
              'sourceBytes': 189515,
              'sourceDimensions': [695, 1536],
              'approvedPanel': [28, 760, 647, 575],
              'canonicalSha256': actual_sha,
              'canonicalBytes': actual_size,
              'canonicalDimensions': list(image.size),
              'alphaBoundingBox': bbox,
              'minimumTransparentSafeMargin': min(margins),
              'sRGB': srgb_present,
              'repositorySourcePresent': source.exists(),
              'canonicalLockVerified': True,
              'toolContractVerified': True,
          }
          Path('/tmp/pink-reproduction-receipt.json').write_text(
              json.dumps(proof, indent=2) + '\n'
          )
          print(json.dumps(proof, sort_keys=True))
          PY

      - name: Reproduce Pink canonical byte-for-byte when source bytes are present
        if: ${{ hashFiles('design_sources/pink/1000389975.jpg') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python mobile/tool/pinkfix_source_reextract.py \
            --source design_sources/pink/1000389975.jpg \
            --output /tmp/pink-reproduced.png \
            --receipt /tmp/pink-reproduction-receipt.json
          cmp /tmp/pink-reproduced.png mobile/assets/products/lunch/pink.png
          echo '1667519c9a1931f16c8d26acefbed65e1f39ae7820ac58551de71a61a580d7fb  /tmp/pink-reproduced.png' | sha256sum -c -
          echo '11a6020417067a8a1869eff1df90d0843f1e068a6cdc06d25e5c92abb1d2e3f5  design_sources/pink/1000389975.jpg' | sha256sum -c -

      - name: Render direct review stages from shipped canonical
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          image = Image.open('mobile/assets/products/lunch/pink.png').convert('RGBA')
          out = Path('/tmp/pink-proof')
          out.mkdir(parents=True, exist_ok=True)
          for name, background in [
              ('white', (255,255,255,255)),
              ('ivory', (248,246,239,255)),
              ('navy', (0,51,102,255)),
          ]:
              stage = Image.new('RGBA', image.size, background)
              stage.alpha_composite(image)
              stage.convert('RGB').save(out / f'pink-{name}.png')
          for size in [96, 160, 240, 384]:
              scaled = image.resize((size,size), Image.Resampling.LANCZOS)
              stage = Image.new('RGBA', (size,size), (0,51,102,255))
              stage.alpha_composite(scaled)
              stage.convert('RGB').save(out / f'pink-navy-{size}.png')
          PY

      - name: Upload Pink custody proof and review stages
        uses: actions/upload-artifact@v4
        with:
          name: pinkfix-proof-${{ github.sha }}
          path: |
            /tmp/pink-reproduction-receipt.json
            /tmp/pink-proof/*.png
          if-no-files-found: error
          retention-days: 14
