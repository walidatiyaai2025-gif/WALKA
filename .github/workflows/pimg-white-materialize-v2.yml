name: PIMG White Materialize v2

on:
  push:
    branches:
      - agent/pimg-031-070-white-approved-ingest-v2
    paths:
      - .github/workflows/pimg-white-materialize-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/pimg-031-070-white-approved-ingest-v2
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deterministic image toolchain
        run: |
          python -m pip install --disable-pip-version-check \
            pillow==12.3.0 \
            numpy==2.3.5 \
            opencv-python-headless==4.13.0.92

      - name: Fetch exact approved source by fingerprint
        shell: bash
        run: |
          set -euo pipefail
          expected='89d7b586c45bd6121537db479139449eb3b8f637c9396d83790d4fd0e03263c2'
          urls=(
            'https://m.media-amazon.com/images/I/51yxoCdmqrL._AC_SL1500_.jpg'
            'https://m.media-amazon.com/images/I/51yxoCdmqrL.jpg'
            'https://images-na.ssl-images-amazon.com/images/I/51yxoCdmqrL._AC_SL1500_.jpg'
            'https://images-na.ssl-images-amazon.com/images/I/51yxoCdmqrL.jpg'
          )
          rm -f /tmp/walka-white-source.jpg
          for url in "${urls[@]}"; do
            echo "Trying $url"
            if ! curl --fail --location --silent --show-error "$url" -o /tmp/walka-white-source.jpg; then
              continue
            fi
            actual="$(sha256sum /tmp/walka-white-source.jpg | awk '{print $1}')"
            echo "Fetched sha256=$actual"
            if [[ "$actual" == "$expected" ]]; then
              echo 'Exact approved source recovered.'
              exit 0
            fi
          done
          echo 'No public candidate matched the owner-connected approved source fingerprint.' >&2
          exit 1

      - name: Materialize deterministic White candidate
        run: |
          python mobile/tool/materialize_white_v2.py \
            --source /tmp/walka-white-source.jpg \
            --output mobile/assets/products/drawer/white.png
          test "$(sha256sum mobile/assets/products/drawer/white.png | awk '{print $1}')" = \
            'b2c6967b6ccb3283a90e26337f90fe15f2f707dbcf20531d760fb656c06d234f'
          test "$(stat -c%s mobile/assets/products/drawer/white.png)" = '189339'

      - name: Commit binary and remove bootstrap tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'walidatiyaai2025-gif'
          git config user.email 'walidatiyaai2025@gmail.com'
          git add mobile/assets/products/drawer/white.png
          git rm .github/workflows/pimg-white-materialize-v2.yml
          git rm mobile/tool/materialize_white_v2.py
          git commit -m 'PIMG-031..070: materialize approved White canonical asset'
          git push origin HEAD:agent/pimg-031-070-white-approved-ingest-v2
