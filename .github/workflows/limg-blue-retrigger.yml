name: LIMG Blue Retrigger

on:
  push:
    branches:
      - agent/limg-blue-001-100-admission
    paths:
      - docs/tmp/limg-blue/READY_V2

permissions:
  contents: write

jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrigger guarded materializers
        run: |
          printf '\nretry=2\n' >> docs/tmp/limg-blue/READY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tmp/limg-blue/READY
          git commit -m "LIMG-BLUE: retrigger guarded canonical materialization"
          git push
