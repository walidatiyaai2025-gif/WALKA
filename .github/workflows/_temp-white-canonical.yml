name: TEMP White canonical admission

on:
  push:
    branches:
      - agent/white-canonical-ci-0812

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  generate-admit-validate-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: agent/white-canonical-ci-0812
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/white-canonical-ci-0812

      - name: Install deterministic image tooling
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir pillow opencv-python-headless

      - name: Generate White canonical from protected approved source
        run: |
          python mobile/tool/_temp_generate_white_canonical.py | tee /tmp/white-generation-receipt.json
          test -f mobile/assets/products/drawer/white.png
          git diff --name-only origin/main...HEAD | grep '^Images/' && exit 1 || true
          git diff --name-only | grep '^Images/' && exit 1 || true

      - name: Upload White visual QA package
        uses: actions/upload-artifact@v4
        with:
          name: white-canonical-qa-${{ github.sha }}
          path: |
            .white-canonical-qa/
            /tmp/white-generation-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit only canonical asset and truthful metadata
        run: |
          rm -f mobile/tool/_temp_generate_white_canonical.py
          rm -f .github/workflows/_temp-white-canonical.yml
          rm -rf .white-canonical-qa
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --name-only | grep '^Images/' && exit 1 || true
          git commit -m 'LIMG-WHITE: admit canonical production asset'
          git push origin HEAD:${BRANCH}

      - name: Open White admission PR
        id: pr
        run: |
          PR_URL=$(gh pr create --repo "$REPO" --base main --head "$BRANCH" \
            --title 'LIMG-WHITE: admit canonical White production asset' \
            --body 'Admits only the approved real Drawer Organizer White canonical asset. The PNG is generated from the protected approved source without geometry reconstruction; protected Images remain unchanged. Source admission/provenance are updated only for White. Gray stays BLOCKED and the overall visual release #230 stays OPEN until full 5/5 + final visual acceptance. Merge is allowed only after the normal PR workflow is Green.')
          PR_NUM=${PR_URL##*/}
          echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for normal PR CI and merge only Green
        run: |
          PR='${{ steps.pr.outputs.number }}'
          HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          seen=0
          for i in $(seq 1 120); do
            JSON=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=50")
            COUNT=$(printf '%s' "$JSON" | jq '.workflow_runs | length')
            if [ "$COUNT" -gt 0 ]; then seen=1; fi
            FAIL=$(printf '%s' "$JSON" | jq '[.workflow_runs[] | select(.status=="completed" and .conclusion!="success")] | length')
            PENDING=$(printf '%s' "$JSON" | jq '[.workflow_runs[] | select(.status!="completed")] | length')
            if [ "$FAIL" -gt 0 ]; then
              echo 'Normal PR CI failed; refusing merge.'
              gh pr comment "$PR" --repo "$REPO" --body 'White admission automation stopped: normal PR CI has a non-success conclusion. No merge was performed.'
              exit 1
            fi
            if [ "$seen" -eq 1 ] && [ "$PENDING" -eq 0 ]; then
              break
            fi
            sleep 15
          done
          [ "$seen" -eq 1 ] || { echo 'No PR workflow run observed'; exit 1; }
          JSON=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=50")
          test "$(printf '%s' "$JSON" | jq '[.workflow_runs[] | select(.status!="completed" or .conclusion!="success")] | length')" -eq 0
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"

      - name: Verify latest main and keep visual blocker truthful
        run: |
          PR='${{ steps.pr.outputs.number }}'
          for i in $(seq 1 20); do
            MAIN_SHA=$(gh api "repos/$REPO/commits/main" --jq .sha)
            if gh api "repos/$REPO/contents/mobile/assets/products/drawer/white.png?ref=main" >/dev/null 2>&1; then break; fi
            sleep 6
          done
          echo "Merged PR #$PR; current main: $MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
          gh issue comment 230 --repo "$REPO" --body "White canonical admission merged from automated approved-source pipeline via PR #$PR. White is now present on main and recorded ADMITTED. Protected Images were read-only. This is partial progress only: #230 remains OPEN until Gray + Blue/Pink/Green + final owner/reference visual acceptance are satisfied."
