name: API-001 Lock Fix

on:
  push:
    branches:
      - agent/api-001-laravel-foundation
    paths:
      - '.github/workflows/api-001-lock-fix.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/api-001-laravel-foundation

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, libxml, sqlite3
          coverage: none
          tools: composer:v2

      - name: Refresh Composer lock metadata
        working-directory: backend
        run: composer update --lock --no-interaction --no-progress

      - name: Validate lock
        working-directory: backend
        run: composer validate --strict

      - name: Commit refreshed lock
        run: |
          git config user.name "WALKA Team Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/composer.lock
          git commit -m "API-001: refresh Composer lock metadata"
          git push origin HEAD:agent/api-001-laravel-foundation
